version: "2"

linters:
  default: standard
  enable:
    - errname
    - errorlint
    - gocritic
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
